services:
  db:
    image: postgres
    container_name: gas-awareness-db
    restart: always
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Password1!
      POSTGRES_DB: gasAwareness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  api: 
    image: gas-awareness-api
    container_name: gas-awareness-api
    build:
      context: .
      dockerfile: GasAwareness.API/Dockerfile
    ports:
      - "5052:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__PostgreSqlConnectionString=Host=db;Port=5432;Database=gasAwareness;Username=sa;Password=Password1!
    restart: on-failure
    volumes:
      - ./uploads:/app/wwwroot/files

  ui:
    image: gas-awareness-ui
    container_name: gas-awareness-ui
    build:
      context: .
      dockerfile: GasAwareness.UI/Dockerfile
    ports:
      - "5072:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - APIBaseUrl=http://api:8080/api/
    volumes:
      - ./GasAwareness.UI/wwwroot/files:/app/wwwroot/files
  
volumes:
  postgres_data: